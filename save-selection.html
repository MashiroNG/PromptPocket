<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>保存提示词</title>
  <script src="save-selection-theme.js"></script>
  <link rel="stylesheet" href="save-selection.css" />
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand">
        <img class="app-icon" src="icons/48.png" alt="" aria-hidden="true" />
        <div class="header-copy">
          <h1>保存提示词</h1>
          <p>确认标题、内容和归类后再保存</p>
        </div>
      </div>
      <button type="button" class="icon-button" id="closeBtn" aria-label="关闭保存窗口" title="关闭">×</button>
    </header>

    <section class="form" aria-label="提示词信息">
      <div class="field">
        <div class="field-heading">
          <label for="promptTitle">标题</label>
          <span class="character-count" id="titleCount">0 字</span>
        </div>
        <input id="promptTitle" type="text" placeholder="给这条提示词起个名字" />
      </div>

      <div class="field">
        <div class="field-heading">
          <label for="folderSelect">保存到</label>
        </div>
        <div class="folder-row">
          <select id="folderSelect"></select>
          <button type="button" class="secondary-button" id="newFolderBtn">＋ 新建</button>
        </div>
        <div class="new-folder-row" id="newFolderRow">
          <input id="newFolderName" type="text" placeholder="新文件夹名称" />
          <button type="button" class="small-button primary-soft" id="confirmFolderBtn">添加</button>
          <button type="button" class="small-button" id="cancelFolderBtn">取消</button>
        </div>
      </div>

      <div class="field prompt-field">
        <div class="field-heading">
          <label for="promptText">提示词内容</label>
          <span class="character-count" id="textCount">0 字</span>
        </div>
        <textarea id="promptText" placeholder="这里是刚选中的内容，可以保存前修改"></textarea>
      </div>

      <label class="option-row">
        <input id="promptPinned" type="checkbox" />
        <span class="option-copy">
          <span class="option-title">置顶到一级菜单</span>
          <span class="option-desc">适合高频提示词，可在右键菜单直接使用</span>
        </span>
      </label>
    </section>

    <div id="errorText" class="error" role="alert"></div>

    <footer class="actions">
      <button type="button" id="cancelBtn">取消</button>
      <button type="button" class="primary" id="saveBtn">保存</button>
    </footer>
  </main>

  <script src="folder-message-contract.js"></script>
  <script src="save-selection.js"></script>
</body>
</html>
